<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>غادي نتزوجك – Tarik & Yassmine</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Cairo:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b1d3a;--paper:#fff7ec;--accent:#e8575a;--bar:#1c1226;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;background:var(--bar);color:var(--paper);font-family:'Baloo 2',system-ui,sans-serif}
main{max-width:900px;margin:0 auto;padding:12px}
#stage{width:100%;display:block;border-radius:14px;background:#000}
#bg{transition:fill 1.2s}
#sun{transition:cy 1.5s,fill 1.2s}
.prop{opacity:0;transition:opacity .8s}
.prop.on{opacity:1}
.ch{transition:transform 1.6s ease-in-out}
.mouth{transform-box:fill-box;transform-origin:center}
.talk .mouth{animation:talk .22s infinite alternate}
.talk .bob{animation:bob .5s infinite alternate}
@keyframes talk{from{transform:scaleY(.3)}to{transform:scaleY(1.4)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-4px)}}
#title{font-size:15px;opacity:.7;margin:0 0 8px}
#sub{min-height:112px;text-align:center;padding:10px 6px}
#ar{font-family:'Cairo',system-ui,sans-serif;font-weight:800;font-size:clamp(22px,4.6vw,32px);direction:rtl;line-height:1.5}
#lat{font-size:clamp(16px,3vw,20px);color:#ffd9a3}
#es{font-size:14px;opacity:.65}
#ctl{display:flex;gap:10px;justify-content:center;align-items:center}
button{font:inherit;font-weight:700;background:var(--accent);color:#fff;border:0;border-radius:999px;padding:8px 22px;cursor:pointer}
button:focus-visible{outline:3px solid #ffd9a3;outline-offset:2px}
#bar{flex:1;height:6px;background:#3a2a4d;border-radius:3px;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:#ffd9a3}
@media (prefers-reduced-motion:reduce){.ch,#bg,#sun{transition:none}.talk .mouth,.talk .bob{animation:none}}
</style>
</head>
<body>
<main>
<p id="title">غادي نتزوجك · Ghadi ntzewjek · «Me voy a casar contigo»</p>
<svg id="stage" viewBox="0 0 800 450" role="img" aria-label="Animación de Tarik y Yassmine">
  <rect id="bg" width="800" height="450" fill="#9fd8f5"/>
  <circle id="sun" cx="650" cy="80" r="42" fill="#ffe27a"/>
  <g fill="#fff" opacity=".85"><ellipse cx="150" cy="70" rx="50" ry="16"/><ellipse cx="190" cy="60" rx="34" ry="14"/><ellipse cx="430" cy="110" rx="46" ry="14"/></g>
  <rect y="360" width="800" height="90" fill="#6fbf73" id="ground"/>
  <!-- trees -->
  <g id="trees" class="prop"><rect x="60" y="250" width="22" height="115" fill="#7a4b2a"/><circle cx="71" cy="235" r="60" fill="#3f9a5a"/><rect x="720" y="260" width="20" height="105" fill="#7a4b2a"/><circle cx="730" cy="245" r="52" fill="#3f9a5a"/></g>
  <!-- props -->
  <g id="balcony" class="prop"><rect x="560" y="160" width="190" height="200" fill="#f0c9a0"/><rect x="580" y="190" width="60" height="80" fill="#8fd0ea"/><rect x="545" y="262" width="220" height="14" fill="#9b6b48"/><g stroke="#9b6b48" stroke-width="4"><path d="M560 276v40M600 276v40M640 276v40M680 276v40M720 276v40M752 276v40"/></g><rect x="545" y="316" width="220" height="8" fill="#9b6b48"/></g>
  <g id="desk" class="prop"><rect x="270" y="300" width="270" height="14" fill="#8a5a3a"/><rect x="285" y="314" width="12" height="46" fill="#8a5a3a"/><rect x="513" y="314" width="12" height="46" fill="#8a5a3a"/><rect x="330" y="250" width="90" height="50" rx="5" fill="#34495e"/><rect x="336" y="256" width="78" height="38" fill="#a8e0ff"/>
   <g transform="translate(600,120)"><rect width="120" height="110" rx="8" fill="#fff"/><rect width="120" height="26" rx="8" fill="#e8575a"/><text id="cal" x="60" y="80" text-anchor="middle" font-size="44" font-weight="700" fill="#2b1d3a">1</text></g>
   <g transform="translate(120,100)"><rect width="90" height="90" rx="45" fill="#fff" stroke="#2b1d3a" stroke-width="5"/><line x1="45" y1="45" x2="45" y2="15" stroke="#2b1d3a" stroke-width="5" stroke-linecap="round"/><line id="hand" x1="45" y1="45" x2="70" y2="45" stroke="#e8575a" stroke-width="5" stroke-linecap="round" style="transform-origin:45px 45px"/></g></g>
  <g id="bench" class="prop"><rect x="270" y="290" width="260" height="14" fill="#8a5a3a"/><rect x="270" y="250" width="260" height="12" fill="#8a5a3a"/><rect x="285" y="304" width="12" height="56" fill="#6d4429"/><rect x="503" y="304" width="12" height="56" fill="#6d4429"/><rect x="285" y="250" width="12" height="54" fill="#6d4429"/><rect x="503" y="250" width="12" height="54" fill="#6d4429"/></g>
  <g id="heart" class="prop"><path d="M400 150c-30-34-80-4-50 32 14 16 50 40 50 40s36-24 50-40c30-36-20-66-50-32z" fill="#e8575a"/></g>

  <!-- Yassmine -->
  <g id="Y" class="ch"><g class="bob">
    <path d="M-34 -150c-14 40-14 90-6 130l92 0c8-40 8-90-6-130z" fill="#2a1a14"/>
    <rect x="-24" y="-112" width="48" height="76" rx="14" fill="#e8575a"/>
    <path d="M-24 -50h48l14 50h-76z" fill="#e8575a"/>
    <rect x="-14" y="-6" width="10" height="10" fill="#f2c9a5"/><rect x="4" y="-6" width="10" height="10" fill="#f2c9a5"/>
    <rect x="-20" y="-112" width="12" height="70" rx="6" fill="#f2c9a5" transform="rotate(8 -14 -112)"/><rect x="8" y="-112" width="12" height="70" rx="6" fill="#f2c9a5" transform="rotate(-8 14 -112)"/>
    <circle cy="-140" r="30" fill="#f2c9a5"/>
    <path d="M-32 -142c2-30 62-30 64 0c-14-14-50-14-64 0z" fill="#2a1a14"/>
    <circle cx="-10" cy="-140" r="3.5" fill="#2b1d3a"/><circle cx="10" cy="-140" r="3.5" fill="#2b1d3a"/>
    <circle cx="-17" cy="-130" r="5" fill="#ff9a9a" opacity=".6"/><circle cx="17" cy="-130" r="5" fill="#ff9a9a" opacity=".6"/>
    <ellipse class="mouth" cy="-124" rx="6" ry="4" fill="#9b2c3a"/>
  </g></g>
  <!-- Tarik -->
  <g id="T" class="ch"><g class="bob">
    <g id="pack"><rect x="-38" y="-108" width="22" height="58" rx="8" fill="#4a6fa5"/></g>
    <rect x="-24" y="-112" width="48" height="72" rx="10" fill="#3a8fb7"/>
    <rect x="-22" y="-40" width="20" height="40" fill="#34495e"/><rect x="2" y="-40" width="20" height="40" fill="#34495e"/>
    <rect x="-26" y="-4" width="24" height="8" rx="4" fill="#222"/><rect x="2" y="-4" width="26" height="8" rx="4" fill="#222"/>
    <rect x="-36" y="-108" width="12" height="62" rx="6" fill="#d9a77c"/><rect x="24" y="-108" width="12" height="62" rx="6" fill="#d9a77c"/>
    <circle cy="-140" r="30" fill="#d9a77c"/>
    <path d="M-30 -146c4-26 56-26 60 0c-12-10-48-10-60 0z" fill="#1d1410"/>
    <circle cx="-10" cy="-140" r="3.5" fill="#2b1d3a"/><circle cx="10" cy="-140" r="3.5" fill="#2b1d3a"/>
    <path d="M-14 -152l9-3M5 -155l9 3" stroke="#1d1410" stroke-width="3" stroke-linecap="round"/>
    <ellipse class="mouth" cy="-124" rx="6" ry="4" fill="#8a3a2a"/>
  </g></g>
</svg>
<div id="sub" aria-live="polite"><div id="ar"></div><div id="lat"></div><div id="es"></div></div>
<div id="ctl"><button id="pb">▶ Empezar</button><button id="vb" aria-pressed="true">🔊 Voz</button><div id="bar"><i></i></div></div>
</main>
<script>
// Escenas: cielo, sol(y), posiciones, props activos
var S={
 1:{bg:'#9fd8f5',sun:90,sc:'#ffe27a',g:'#6fbf73',t:[200,360],y:[640,262],p:['balcony'],pack:1},
 2:{bg:'#cfe8ff',sun:70,sc:'#ffe27a',g:'#b9a98a',t:[400,360],y:[690,360],p:['desk'],pack:0},
 3:{bg:'#f7a26b',sun:230,sc:'#ffd166',g:'#5aa56a',t:[340,330],y:[460,330],p:['bench','trees'],pack:0},
 4:{bg:'#f08a5d',sun:270,sc:'#ffb84d',g:'#4f9a62',t:[355,330],y:[445,330],p:['bench','trees'],pack:0},
 5:{bg:'#e56b6f',sun:300,sc:'#ff9f45',g:'#478a5a',t:[355,330],y:[445,330],p:['bench','trees'],pack:0},
 6:{bg:'#b56576',sun:340,sc:'#ff7b54',g:'#3f7a52',t:[378,360],y:[428,360],p:['trees','heart'],pack:0}
};
var L=[
 [1,'Y','الله يعاونك a طارق!','Llah y3awnek a Tarik!','¡Que Dios te ayude, Tarik!'],
 [1,'T','ديري ليا دعوة.','Dir lia d3wa.','Hazme una oración.'],
 [2,'T','كل نهار كنخدم بزاف، وفكري ديما معاها.','Koul nhar kankhdem bzaf, w fekri dima m3aha.','(voz en off) Cada día trabajo mucho, y mi mente siempre está con ella.'],
 [3,'T','ياسمين، بغيت نهضر معاك على شي حاجة مهمة.','Yassmine, bghit nhder m3ak 3la chi haja mohimma.','Yassmine, quiero hablar contigo de algo importante.'],
 [3,'Y','واخا، سمعتك.','Wakha, sm3tek.','Vale, te escucho.'],
 [4,'T','أنا كنبغيك بزاف، وغادي نتزوجك.','Ana kanbghik bzaf, w ghadi ntzewjek.','Te quiero mucho y me voy a casar contigo.'],
 [4,'Y','ومتى؟','W fach?','¿Y cuándo?'],
 [4,'T','غير ملي نولي عندي بزاف ديال الفلوس.','Ghir mli nwelli 3ndi bzaf dyal lflous.','Cuando tenga mucho dinero.'],
 [5,'Y','واخا، أنا غادي نتسناك.','Wakha, ana ghadi ntsnak.','Vale, te voy a esperar.'],
 [6,'N','الحب الحقيقي كيصبر ❤️','Lhob l7a9i9i kaysber.','El amor verdadero sabe esperar.']
];
var $=function(i){return document.getElementById(i)},T=$('T'),Y=$('Y'),cur=0,timer=null,playing=false,scene=0,DUR=3600,props=['balcony','desk','bench','trees','heart'];
function setScene(n){
 var s=S[n];scene=n;$('bg').setAttribute('fill',s.bg);$('ground').setAttribute('fill',s.g);
 $('sun').setAttribute('cy',s.sun);$('sun').setAttribute('fill',s.sc);
 props.forEach(function(p){$(p).classList.toggle('on',s.p.indexOf(p)>-1)});
 $('pack').style.display=s.pack?'':'none';
 T.style.transform='translate('+s.t[0]+'px,'+s.t[1]+'px)';
 Y.style.transform='translate('+s.y[0]+'px,'+s.y[1]+'px)';
 if(n==2){var d=0;clearInterval(window.cl);window.cl=setInterval(function(){d=(d+1)%30;$('cal').textContent=(d*12+1);$('hand').style.transform='rotate('+(d*60)+'deg)'},120);}
 else{clearInterval(window.cl)}
}
function show(i){
 var l=L[i];if(l[0]!==scene)setScene(l[0]);
 $('ar').textContent=l[2];$('lat').textContent=l[3];$('es').textContent=l[4];
 T.classList.toggle('talk',l[1]==='T');Y.classList.toggle('talk',l[1]==='Y');
 document.querySelector('#bar i').style.width=((i+1)/L.length*100)+'%';speak(i);
}
function next(){
 cur++;
 if(cur>=L.length){stop();T.classList.remove('talk');Y.classList.remove('talk');$('pb').textContent='↺ Repetir';cur=-1;return}
 show(cur);timer=setTimeout(next,DUR);
}
var voiceOn=true;
function speak(i){try{if(!voiceOn||!window.speechSynthesis)return;speechSynthesis.cancel();var l=L[i],u=new SpeechSynthesisUtterance(l[2].replace('❤️','')),vs=speechSynthesis.getVoices(),v=vs.find(function(x){return /ar[-_]MA/i.test(x.lang)})||vs.find(function(x){return /^ar/i.test(x.lang)});if(v)u.voice=v;u.lang=v?v.lang:'ar-MA';u.pitch=l[1]==='Y'?1.5:0.8;u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
$('vb').onclick=function(){voiceOn=!voiceOn;$('vb').setAttribute('aria-pressed',voiceOn);$('vb').textContent=voiceOn?'🔊 Voz':'🔇 Sin voz';try{if(!voiceOn)speechSynthesis.cancel()}catch(e){}};
function stop(){clearTimeout(timer);playing=false;try{speechSynthesis.cancel()}catch(e){}}
$('pb').onclick=function(){
 if(playing){stop();$('pb').textContent='▶ Seguir';T.classList.remove('talk');Y.classList.remove('talk');return}
 playing=true;$('pb').textContent='⏸ Pausa';
 if(cur<0||cur===0&&!$('ar').textContent){cur=0;scene=0;show(0);timer=setTimeout(next,DUR)}
 else{if(cur<0)cur=0;timer=setTimeout(next,600)}
};
setScene(1);T.style.transform='translate(200px,360px)';
</script>
</body>
</html>
