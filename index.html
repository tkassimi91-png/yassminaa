<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Love Game ❤️</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  font-family: Arial;
  text-align: center;
  color: white;
}
/* password screen */
#passwordScreen {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: black;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

/* welcome */
#welcomeScreen {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  display: none;
  justify-content: center;
  align-items: center;
  background: rgba(0,0,0,0.9);
  font-size: 25px;
}
#menu, #game, #score, #popup {
  display: none;
}
/* 🎥 video */
#bgVideo {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: -1;
}

/* menu */
#menu {
  margin-top: 100px;
}

.choice {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  margin: 20px;
  cursor: pointer;
  border: 3px solid white;
}

/* game */
#game {
  width: 300px;
  height: 400px;
  border: 2px solid white;
  margin: auto;
  position: relative;
  overflow: hidden;
  margin-top: 20px;
  backdrop-filter: blur(5px);
  display: none;
}

#player {
  width: 50px;
  height: 50px;
  position: absolute;
  bottom: 10px;
  left: 125px;
}

#player img {
  width: 100%;
  height: 100%;
  border-radius: 50%;
}

.heart {
  position: absolute;
  font-size: 25px;
}

/* popup */
#popup {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(0,0,0,0.8);
  padding: 20px;
  border-radius: 15px;
  display: none;
}

button {
  margin: 10px;
  padding: 10px;
  cursor: pointer;
}
</style>
</head>

<body>
<!-- 🔐 PASSWORD SCREEN -->
<div id="passwordScreen">
  <h2>ketbi hna dikchi li 9otlk </h2>
  <input type="password" id="passwordInput" placeholder="ktebi...">
  <br><br>
  <button onclick="checkPassword()">breki hna </button>
  <p id="error" style="color:red;"></p>
</div>

<!-- 💖 WELCOME MESSAGE -->
<div id="welcomeScreen">
  <h1>Marhba bik f l3ba dyalna ❤️</h1>
</div>
<video id="bgVideo" autoplay loop muted>
  <source src="us.mp4" type="video/mp4">
</video>

<!-- MENU -->
<div id="menu">
  <h1>bach b4iti tl3bi  😏</h1>
  <img src="me.JPG" class="choice" onclick="startGame('me.png')">
  <img src="her.PNG" class="choice" onclick="startGame('her.png')">
</div>

<!-- GAME -->
<div id="game">
  <div id="player">
    <img id="playerImg">
  </div>
</div>

<p id="score">Score: 0</p>

<!-- POPUP -->
<div id="popup">
  <p id="popupText"></p>
  <button onclick="continueGame()">Yes 😏</button>
  <button onclick="restartGame()">No 😢</button>
</div>

<audio id="sound" src="pop.mp3"></audio>

<script>
    let correctPassword = "sayed lbi7ar"; // 🔁 بدلها بالpassword ديالك

function checkPassword() {
   
  let input = document.getElementById("passwordInput").value;
  let error = document.getElementById("error");

  if (input === correctPassword) {
    document.getElementById("passwordScreen").style.display = "none";

    let welcome = document.getElementById("welcomeScreen");
    welcome.style.display = "flex";

    // ⏳ من بعد 2 ثواني تبان اللعبة
    setTimeout(() => {
      welcome.style.display = "none";
      document.getElementById("menu").style.display = "block";
    }, 2000);

  } else {
    error.innerText = "wa l9lawi la dekhlti o makonti yassmine";
  }
}
let player = document.getElementById("player");
let playerImg = document.getElementById("playerImg");
let game = document.getElementById("game");
let popup = document.getElementById("popup");
let popupText = document.getElementById("popupText");

let position = 125;
let score = 0;

/* 🎮 start */
function startGame(img) {
  playerImg.src = img;
  document.getElementById("menu").style.display = "none";
  game.style.display = "block";
}

/* 🖱️ mouse / touch */
game.addEventListener("mousemove", (e) => {
  position = e.offsetX - 25;
  player.style.left = position + "px";
});

game.addEventListener("touchmove", (e) => {
  let rect = game.getBoundingClientRect();
  position = e.touches[0].clientX - rect.left - 25;
  player.style.left = position + "px";
});

/* ❤️ hearts */
function createHeart() {
  let heart = document.createElement("div");
  heart.classList.add("heart");
  heart.innerText = "❤️";

  heart.style.left = Math.random() * 260 + "px";
  heart.style.top = "0px";

  game.appendChild(heart);

  let fall = setInterval(() => {
    let top = parseInt(heart.style.top);
    heart.style.top = top + 5 + "px";

    if (top > 330 && Math.abs(parseInt(heart.style.left) - position) < 40) {
      score++;
      document.getElementById("score").innerText = "Score: " + score;

      document.getElementById("sound").play();

      heart.remove();
      clearInterval(fall);

      checkMessage();
    }

    if (top > 400) {
      heart.remove();
      clearInterval(fall);
    }
  }, 50);
}

setInterval(createHeart, 1000);

/* 💌 popup messages */

let shownMessages = [];

function checkMessage() {
  if (score >= 5 && !shownMessages.includes(5)) {
    shownMessages.push(5);
    showPopup("db wsalti l 5 dyal l9loba 🤗 <br> b4iti tkmli ?  ");
  }

  if (score >= 10 && !shownMessages.includes(10)) {
    shownMessages.push(10);
    showPopup("db 10 khasha chi chti7a 😘 <br> b4iti tkmli ?");
  }

  if (score >= 20 && !shownMessages.includes(20)) {
    shownMessages.push(20);
    showPopup("ach balki db 7it wsalti l 20 tsdmini bchi haja ahhh ❤️ <br> b4iti tkmli ?");
  }

  if (score >= 30 && !shownMessages.includes(30)) {
    shownMessages.push(30);
    showPopup("sff nti wa3ra wsalti l 30 antzwej biki sff  ❤️ <br> b4iti tkmli ?");
  }
}
function showPopup(text) {
  popupText.innerHTML = text;
  popup.style.display = "block";
}

/* buttons */
function continueGame() {
  popup.style.display = "none";
}

function restartGame() {
    shownMessages = [];
  popup.style.display = "none";
  score = 0;
  document.getElementById("score").innerText = "Score: 0";

  game.style.display = "none";
  document.getElementById("menu").style.display = "block";
}
</script>

</body>
</html>
