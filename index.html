<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!-- Título que sale en la pestaña del navegador (puedes cambiarlo) -->
<title>happy birthday 💖</title>

<!-- Tipografías de Google (necesitan internet) -->
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<!-- Estilo del botón nuevo que lleva a page2.html -->
<style>
#last{
  position:fixed;
  left:50%;
  bottom:calc(24px + env(safe-area-inset-bottom,0px));
  transform:translateX(-50%);
  z-index:9999;
  padding:14px 28px;
  border-radius:999px;
  background:linear-gradient(135deg,#ff6fa5,#ff9acb);
  color:#fff;
  font-family:'Quicksand',sans-serif;
  font-weight:700;
  font-size:1.1rem;
  text-decoration:none;
  white-space:nowrap;
  box-shadow:0 8px 24px rgba(255,80,150,.45);
  opacity:0;
  transition:opacity 1.5s ease;
}
#last.show{opacity:1}
#last[hidden]{display:none}
</style>
</head>
<body>

<!-- Fondo animado (lluvia rosa y estrellas). No tocar -->
<canvas id="bg"></canvas>

<!-- ESCENA 0: pantalla inicial -->
<section class="scene on" id="s0">
<div class="hint">3ndi chi haja lik…</div>   <!-- texto que puedes cambiar -->
<button id="start">diri click bach nbdaw</button> <!-- texto que puedes cambiar -->
</section>

<!-- ESCENA 1: cuenta atrás y felicitación (los textos se cambian en script.js) -->
<section class="scene" id="s1">
<div id="word"></div>
</section>

<!-- ESCENA 2: cielo estrellado con la tarta -->
<section class="scene" id="s2">
<div class="hint">tmnay ykono 3ndna flosat 9bel matfi chm3a</div>  <!-- texto que puedes cambiar -->
<button id="cake" aria-label="Abrir sorpresa">🎂</button>
</section>

<!-- ESCENA 3: el libro con las fotos -->
<section class="scene" id="s3">
<div class="card" id="msg"></div>   <!-- aquí salen tus frases -->

<div class="book">
<div class="pg pl"><img id="pl" alt="Un recuerdo nuestro"></div>   <!-- página izquierda -->
<div class="pg pr"><img id="pr" alt="Otro recuerdo nuestro"></div> <!-- página derecha -->
<div class="leaf" id="leaf"><img id="lf" alt=""></div>             <!-- hoja que gira -->
<button class="cover" id="cover" aria-label="Abrir el libro">💗<span>click bach t7li</span></button>
</div>

<!-- Este botón solo aparece tras la última foto -->
<button id="next" hidden>akhir haja 💖</button>
</section>

<!-- ESCENA 4: corazón de fotos -->
<section class="scene" id="s4">
<div id="heart"></div>
<div class="final" id="final"></div>
</section>

<!-- BOTÓN NUEVO: lleva a page2.html (aparece al final de la escena 4) -->
<a id="last" href="page2.html" hidden>akhir haja a7biba</a>

<script src="script.js"></script>

<!-- Muestra el botón nuevo unos segundos después de empezar la escena 4 -->
<script>
(function(){
  var DELAY = 8000; // milisegundos (8000 = 8 segundos). Cámbialo si quieres.
  var s4 = document.getElementById('s4');
  var last = document.getElementById('last');
  var timer = null;

  function check(){
    if (s4.classList.contains('on') && !timer){
      timer = setTimeout(function(){
        last.hidden = false;
        requestAnimationFrame(function(){ last.classList.add('show'); });
      }, DELAY);
    }
  }

  new MutationObserver(check).observe(s4, {attributes:true, attributeFilter:['class']});
  check();
})();
</script>
</body>
</html>
